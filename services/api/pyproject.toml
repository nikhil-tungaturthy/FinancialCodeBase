[project]
name = "meridian-api"
version = "0.1.0"
description = "Meridian Flow API — payments, exceptions, settlement, reconciliation, approvals, audit"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143,<0.162",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "structlog>=26.1,<27",
  "typer>=0.27,<0.28",
  "rich>=15.0,<16",
  "python-dotenv>=1.2,<2",
  "tzdata>=2026.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
