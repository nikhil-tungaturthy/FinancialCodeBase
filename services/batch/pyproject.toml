[project]
name = "meridian-batch"
version = "0.1.0"
description = "Meridian Flow batch jobs — settlement window close, ledger posting, daily reconciliation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "meridian-api",
  "typer>=0.27,<0.28",
  "structlog>=26.1,<27",
  "sqlalchemy>=2.0.36,<2.2",
]

[project.scripts]
meridian-batch = "batch.jobs.cli:app"

[tool.uv.sources]
meridian-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["batch"]
